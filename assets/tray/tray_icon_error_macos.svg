<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- macOS template image: black plus alpha only. The system tints it to match
       the menu bar, so state reads from the badge shape, never from colour.
       error = filled cross badge. -->
  <mask id="halo">
    <rect width="36" height="36" fill="white"/>
    <circle cx="26.5" cy="26.5" r="8.6" fill="black"/>
  </mask>
  <g mask="url(#halo)">
    <path d="M4.5 16.2 30.5 4.8 21.6 32 15.2 20.9 4.5 16.2Z" fill="black"/>
  </g>
  <circle cx="26.5" cy="26.5" r="6.4" fill="black"/>
  <path d="M24.2 24.2 28.8 28.8 M28.8 24.2 24.2 28.8" fill="none" stroke="white"
        stroke-width="2.1" stroke-linecap="round"/>
</svg>
