name: Build Flutter App
run-name: CipherRelay ${{ inputs.release_tag }} · native ${{ inputs.lib_version }}

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'Native library version from proxy-everything releases (e.g., 0.4.10)'
        required: true
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (e.g., v1.0.0), required if create_release is true'
        required: false

env:
  # Keep in step with `.fvmrc`: the local builds are validated on that SDK, and
  # a release built on a different one is a release nobody tested.
  FLUTTER_VERSION: '3.47.7'
  PRIVATE_REPO: acking-you/proxy-everything

permissions:
  contents: write

jobs:
  download-native-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Test desktop release packaging
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Download native libraries
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          LIB_VERSION: ${{ github.event.inputs.lib_version }}
        run: |
          # Desktop only. The mobile libraries this used to fetch are consumed
          # by local builds, which fetch them themselves.
          mkdir -p native/{macos,windows/{x64,arm64},linux/{x64,arm64}}
          WORK_DIR=$(mktemp -d)
          trap 'rm -rf "$WORK_DIR"' EXIT
          gh release download "$LIB_VERSION" -R "$PRIVATE_REPO" \
            -p SHA256SUMS -p release-manifest.json -D "$WORK_DIR"

          # macOS
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            echo "Downloading macOS: $target"
            gh release download "$LIB_VERSION" \
              -R "$PRIVATE_REPO" \
              -p "libhttp_proxy-${LIB_VERSION}-${target}.tar.gz" \
              -D "$WORK_DIR"
            (cd "$WORK_DIR" && sha256sum --ignore-missing -c SHA256SUMS)
            tar -xzf "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}.tar.gz" -C "$WORK_DIR"
            cp "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}/libhttp_proxy.dylib" "native/macos/libhttp_proxy-${target}.dylib"
            # macOS needs root to create a utun device and cannot elevate a
            # running app, so TUN mode runs in this separately authorized helper.
            cp "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}/http-proxy-tun-helper" "native/macos/http-proxy-tun-helper-${target}"
          done

          # Windows
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            echo "Downloading Windows: $target"
            gh release download "$LIB_VERSION" \
              -R "$PRIVATE_REPO" \
              -p "libhttp_proxy-${LIB_VERSION}-${target}.zip" \
              -D "$WORK_DIR"
            (cd "$WORK_DIR" && sha256sum --ignore-missing -c SHA256SUMS)
            unzip -o "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}.zip" -d "$WORK_DIR"
            case $target in
              x86_64-pc-windows-msvc) dest="x64" ;;
              aarch64-pc-windows-msvc) dest="arm64" ;;
            esac
            cp "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}/http_proxy.dll" "native/windows/$dest/"
            cp "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}/wintun.dll" "native/windows/$dest/"
          done

          # Linux
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            echo "Downloading Linux: $target"
            gh release download "$LIB_VERSION" \
              -R "$PRIVATE_REPO" \
              -p "libhttp_proxy-${LIB_VERSION}-${target}.tar.gz" \
              -D "$WORK_DIR"
            (cd "$WORK_DIR" && sha256sum --ignore-missing -c SHA256SUMS)
            tar -xzf "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}.tar.gz" -C "$WORK_DIR"
            case $target in
              x86_64-unknown-linux-gnu) dest="x64" ;;
              aarch64-unknown-linux-gnu) dest="arm64" ;;
            esac
            cp "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}/libhttp_proxy.so" "native/linux/$dest/"
          done

          cp "$WORK_DIR/release-manifest.json" native/native-release-manifest.json
          echo "Downloaded libraries:"
          find native -type f -name "*.so" -o -name "*.dylib" -o -name "*.dll" -o -name "*.a" | head -50

      - name: Upload native libs artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-libs
          path: native/
          retention-days: 1

  build-macos:
    needs: download-native-libs
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check signing failure handling
        run: python3 -B -m unittest discover -s scripts/macos -p 'test_*.py' -v

      - name: Require macOS release credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import os
          required = ('MACOS_CERTIFICATE_P12_BASE64', 'MACOS_CERTIFICATE_PASSWORD',
                      'MACOS_SIGNING_IDENTITY', 'APPLE_TEAM_ID', 'APPLE_NOTARY_PRIVATE_KEY',
                      'APPLE_NOTARY_KEY_ID', 'APPLE_NOTARY_ISSUER_ID')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing macOS release credentials: ' + ', '.join(missing))
          PY

      - uses: actions/download-artifact@v8.0.2
        with:
          name: native-libs
          path: native/

      - name: Create universal binary
        run: |
          cd native/macos
          lipo -create libhttp_proxy-x86_64-apple-darwin.dylib \
            libhttp_proxy-aarch64-apple-darwin.dylib -output libhttp_proxy.dylib
          lipo -create http-proxy-tun-helper-x86_64-apple-darwin \
            http-proxy-tun-helper-aarch64-apple-darwin -output http-proxy-tun-helper
          lipo -verify_arch arm64 x86_64 libhttp_proxy.dylib
          lipo -verify_arch arm64 x86_64 http-proxy-tun-helper
          # The Runner links -lhttp_proxy (see macos/Runner/Configs/Release.xcconfig),
          # and the linker copies whatever install name the dylib carries at that
          # moment into the executable's load command. Rust publishes it with the
          # absolute path from its own build machine, so the rewrite has to happen
          # here, before the Flutter build. Doing it afterwards fixes only the
          # bundled copy: the executable keeps pointing at /Users/runner/... and
          # the shipped app dies on launch with "Library not loaded".
          install_name_tool -id "@rpath/libhttp_proxy.dylib" libhttp_proxy.dylib
          # Sign the dylib before Flutter build
          codesign --force --sign - libhttp_proxy.dylib
          if [ -f "http-proxy-tun-helper" ]; then
            chmod +x http-proxy-tun-helper
            codesign --force --sign - http-proxy-tun-helper
          fi
          ls -la

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - uses: ./.github/actions/setup-fvm

      # `macos/Runner.xcodeproj` is committed with CocoaPods build phases baked
      # in, and no Podfile is tracked because Flutter generates one. From 3.44.9
      # Flutter integrates plugins through Swift Package Manager instead, so it
      # never runs `pod install`, `PODS_ROOT` stays undefined, and the surviving
      # `[CP] Embed Pods Frameworks` phase fails on a path that begins with the
      # empty variable: "Unable to load contents of file list:
      # '/Target Support Files/Pods-Runner/…'". Keeping CocoaPods restores what
      # this project built with before the SDK bump. Migrating the Xcode project
      # to SPM is the real fix and needs a Mac to verify.
      - name: Use CocoaPods for plugin integration
        run: fvm flutter config --no-enable-swift-package-manager

      - name: Build macOS app
        run: |
          fvm flutter pub get
          fvm flutter build macos --release

      - name: Copy dylib and verify install name
        run: |
          APP_DIR="build/macos/Build/Products/Release/CipherRelay.app"
          DYLIB_PATH="$APP_DIR/Contents/Frameworks/libhttp_proxy.dylib"
          mkdir -p "$APP_DIR/Contents/Frameworks"
          cp native/macos/libhttp_proxy.dylib "$DYLIB_PATH"
          # The install name is already @rpath from the staging step, and this
          # copy inherits it. Check the executable rather than trusting that:
          # a bad install name never breaks this build, it only surfaces when
          # someone launches the release, which is how it shipped before.
          EXE="$APP_DIR/Contents/MacOS/CipherRelay"
          if [ ! -f "$EXE" ]; then
            echo "::error::$EXE is missing; the Flutter build did not produce an app"
            exit 1
          fi
          LOADS=$(otool -L "$EXE" | grep libhttp_proxy || true)
          if [ -z "$LOADS" ]; then
            echo "::error::CipherRelay has no libhttp_proxy.dylib load command"
            exit 1
          fi
          BAD=$(printf '%s\n' "$LOADS" | grep -v "@rpath/libhttp_proxy.dylib" || true)
          if [ -n "$BAD" ]; then
            echo "::error::CipherRelay does not load libhttp_proxy.dylib through @rpath"
            echo "$BAD"
            exit 1
          fi
          # The Xcode phase already copies the helper, but re-stage it here for
          # the same reason as the dylib: keep this step the single source of
          # truth for what ends up in the shipped bundle. Native code locates it
          # relative to the main executable, so it belongs in Contents/MacOS.
          if [ -f native/macos/http-proxy-tun-helper ]; then
            cp native/macos/http-proxy-tun-helper "$APP_DIR/Contents/MacOS/http-proxy-tun-helper"
            chmod +x "$APP_DIR/Contents/MacOS/http-proxy-tun-helper"
          else
            echo "::error::http-proxy-tun-helper is missing; macOS TUN mode would not work"
            exit 1
          fi
      - name: Sign, notarize and verify macOS release
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          python3 scripts/macos/package_release.py \
            --app build/macos/Build/Products/Release/CipherRelay.app \
            --output "build/packages/$(python3 scripts/release_artifact_name.py macos universal dmg)"

      - name: Clean up temporary signing credentials
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess
          for directory in pathlib.Path(os.environ['RUNNER_TEMP']).glob('proxy-ui-signing-*'):
              keychain = directory / 'signing.keychain-db'
              if keychain.exists():
                  subprocess.run(['security', 'delete-keychain', str(keychain)], check=True)
              shutil.rmtree(directory)
          PY

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-dmg
          path: build/packages/cipherrelay-*-macos-universal.dmg
          if-no-files-found: error

      - name: Upload macOS verification report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-verification
          path: build/packages/cipherrelay-*-macos-universal-verification/
          if-no-files-found: ignore

      - name: Generate download summary
        run: |
          {
            echo "## 🍎 macOS DMG Build Complete"
            echo ""
            echo "🔗 [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    needs: download-native-libs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: native-libs
          path: native/

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - uses: ./.github/actions/setup-fvm

      - name: Build Windows app with fastforge
        run: |
          fvm dart pub global activate fastforge 0.6.12
          fvm flutter pub get
          fvm dart pub global run fastforge:main release --name production

      - name: Verify Windows bundle
        shell: pwsh
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          foreach ($required in @('CipherRelay.exe', 'http_proxy.dll', 'wintun.dll', 'flutter_windows.dll', 'data')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundle $required))) {
              throw "Windows release bundle is missing $required"
            }
          }

      - name: Package complete Windows portable directory
        run: python scripts/package_windows_portable.py build/windows/x64/runner/Release build/packages

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-packages
          path: |
            dist/**/*.exe
            build/packages/cipherrelay-*-windows-x64.zip
          if-no-files-found: error

      - name: Generate download summary
        shell: bash
        run: |
          {
            echo "## 🪟 Windows Build Complete"
            echo ""
            echo "🔗 [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux:
    needs: download-native-libs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: native-libs
          path: native/

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libxi-dev

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - uses: ./.github/actions/setup-fvm

      - name: Build Linux app
        run: |
          fvm flutter pub get
          fvm flutter build linux --release

      - name: Create archive
        run: |
          test -x build/linux/x64/release/bundle/CipherRelay
          mkdir -p build/packages
          archive="$(python3 scripts/release_artifact_name.py linux x64 tar.gz)"
          tar -C build/linux/x64/release --transform='s,^bundle,CipherRelay,' \
            -czf "build/packages/$archive" bundle

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-tar
          path: build/packages/cipherrelay-*-linux-x64.tar.gz
          if-no-files-found: error

      - name: Generate download summary
        run: |
          {
            echo "## 🐧 Linux Build Complete"
            echo ""
            echo "🔗 [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.create_release == 'true' && github.event.inputs.release_tag != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Validate and collect desktop release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          LIB_VERSION: ${{ inputs.lib_version }}
        run: python3 scripts/collect_desktop_release.py artifacts release "$RELEASE_TAG" "$LIB_VERSION" "$GITHUB_SHA"

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: "CipherRelay ${{ github.event.inputs.release_tag }}"
          draft: false
          body: |
            # CipherRelay Release ${{ github.event.inputs.release_tag }}

            Cross-platform graphical interface for proxy-everything.

            Native library version: ${{ github.event.inputs.lib_version }}

            ## Downloads
            - **macOS**: Developer ID signed and Apple notarized universal DMG (Intel / Apple Silicon)
            - **Windows**: Installer (fastforge) or portable package
            - **Linux**: tar.gz archive
            Android packages are excluded from this release.

            Known verification limits: isolated legacy plain/encrypted TCP tests
            pass; the reported system-wide TUN outage has not been reproduced or
            confirmed resolved, and Windows has no real-device TUN validation.
          files: release/*
