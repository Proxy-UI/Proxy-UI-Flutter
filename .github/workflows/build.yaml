name: Build Flutter App

on:
  workflow_dispatch:
    inputs:
      lib_version:
        description: 'Native library version from proxy-everything releases (e.g., 0.4.10)'
        required: true
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (e.g., v1.0.0), required if create_release is true'
        required: false

env:
  # Keep in step with `.fvmrc`: the local builds are validated on that SDK, and
  # a release built on a different one is a release nobody tested.
  FLUTTER_VERSION: '3.44.9'
  PRIVATE_REPO: acking-you/proxy-everything

permissions:
  contents: write

jobs:
  download-native-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download native libraries
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          LIB_VERSION: ${{ github.event.inputs.lib_version }}
        run: |
          # Desktop only. The mobile libraries this used to fetch are consumed
          # by local builds, which fetch them themselves.
          mkdir -p native/{macos,windows/{x64,arm64},linux/{x64,arm64}}
          WORK_DIR=$(mktemp -d)

          # macOS
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            echo "Downloading macOS: $target"
            gh release download "$LIB_VERSION" \
              -R "$PRIVATE_REPO" \
              -p "libhttp_proxy-${LIB_VERSION}-${target}.tar.gz" \
              -D "$WORK_DIR" || continue
            tar -xzf "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}.tar.gz" -C "$WORK_DIR"
            cp "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}/libhttp_proxy.dylib" "native/macos/libhttp_proxy-${target}.dylib" || true
            # macOS needs root to create a utun device and cannot elevate a
            # running app, so TUN mode runs in this separately authorized helper.
            cp "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}/http-proxy-tun-helper" "native/macos/http-proxy-tun-helper-${target}" || true
          done

          # Windows
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            echo "Downloading Windows: $target"
            gh release download "$LIB_VERSION" \
              -R "$PRIVATE_REPO" \
              -p "libhttp_proxy-${LIB_VERSION}-${target}.zip" \
              -D "$WORK_DIR" || continue
            unzip -o "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}.zip" -d "$WORK_DIR"
            case $target in
              x86_64-pc-windows-msvc) dest="x64" ;;
              aarch64-pc-windows-msvc) dest="arm64" ;;
            esac
            cp "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}/http_proxy.dll" "native/windows/$dest/" || true
          done

          # Linux
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            echo "Downloading Linux: $target"
            gh release download "$LIB_VERSION" \
              -R "$PRIVATE_REPO" \
              -p "libhttp_proxy-${LIB_VERSION}-${target}.tar.gz" \
              -D "$WORK_DIR" || continue
            tar -xzf "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}.tar.gz" -C "$WORK_DIR"
            case $target in
              x86_64-unknown-linux-gnu) dest="x64" ;;
              aarch64-unknown-linux-gnu) dest="arm64" ;;
            esac
            cp "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}/libhttp_proxy.so" "native/linux/$dest/" || true
          done

          echo "Downloaded libraries:"
          find native -type f -name "*.so" -o -name "*.dylib" -o -name "*.dll" -o -name "*.a" | head -50

      - name: Upload native libs artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: native/
          retention-days: 1

  build-macos:
    needs: download-native-libs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: native/

      - name: Create universal binary
        run: |
          cd native/macos
          if [ -f "libhttp_proxy-x86_64-apple-darwin.dylib" ] && [ -f "libhttp_proxy-aarch64-apple-darwin.dylib" ]; then
            lipo -create \
              libhttp_proxy-x86_64-apple-darwin.dylib \
              libhttp_proxy-aarch64-apple-darwin.dylib \
              -output libhttp_proxy.dylib
          elif [ -f "libhttp_proxy-aarch64-apple-darwin.dylib" ]; then
            cp libhttp_proxy-aarch64-apple-darwin.dylib libhttp_proxy.dylib
          elif [ -f "libhttp_proxy-x86_64-apple-darwin.dylib" ]; then
            cp libhttp_proxy-x86_64-apple-darwin.dylib libhttp_proxy.dylib
          fi
          if [ -f "http-proxy-tun-helper-x86_64-apple-darwin" ] && [ -f "http-proxy-tun-helper-aarch64-apple-darwin" ]; then
            lipo -create \
              http-proxy-tun-helper-x86_64-apple-darwin \
              http-proxy-tun-helper-aarch64-apple-darwin \
              -output http-proxy-tun-helper
          elif [ -f "http-proxy-tun-helper-aarch64-apple-darwin" ]; then
            cp http-proxy-tun-helper-aarch64-apple-darwin http-proxy-tun-helper
          elif [ -f "http-proxy-tun-helper-x86_64-apple-darwin" ]; then
            cp http-proxy-tun-helper-x86_64-apple-darwin http-proxy-tun-helper
          fi
          # The Runner links -lhttp_proxy (see macos/Runner/Configs/Release.xcconfig),
          # and the linker copies whatever install name the dylib carries at that
          # moment into the executable's load command. Rust publishes it with the
          # absolute path from its own build machine, so the rewrite has to happen
          # here, before the Flutter build. Doing it afterwards fixes only the
          # bundled copy: the executable keeps pointing at /Users/runner/... and
          # the shipped app dies on launch with "Library not loaded".
          install_name_tool -id "@rpath/libhttp_proxy.dylib" libhttp_proxy.dylib
          # Sign the dylib before Flutter build
          codesign --force --sign - libhttp_proxy.dylib
          if [ -f "http-proxy-tun-helper" ]; then
            chmod +x http-proxy-tun-helper
            codesign --force --sign - http-proxy-tun-helper
          fi
          ls -la

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      # `macos/Runner.xcodeproj` is committed with CocoaPods build phases baked
      # in, and no Podfile is tracked because Flutter generates one. From 3.44.9
      # Flutter integrates plugins through Swift Package Manager instead, so it
      # never runs `pod install`, `PODS_ROOT` stays undefined, and the surviving
      # `[CP] Embed Pods Frameworks` phase fails on a path that begins with the
      # empty variable: "Unable to load contents of file list:
      # '/Target Support Files/Pods-Runner/…'". Keeping CocoaPods restores what
      # this project built with before the SDK bump. Migrating the Xcode project
      # to SPM is the real fix and needs a Mac to verify.
      - name: Use CocoaPods for plugin integration
        run: flutter config --no-enable-swift-package-manager

      - name: Build macOS app
        run: |
          flutter pub get
          flutter build macos --release

      - name: Copy dylib and verify install name
        run: |
          APP_DIR="build/macos/Build/Products/Release/proxy_ui.app"
          DYLIB_PATH="$APP_DIR/Contents/Frameworks/libhttp_proxy.dylib"
          mkdir -p "$APP_DIR/Contents/Frameworks"
          cp native/macos/libhttp_proxy.dylib "$DYLIB_PATH"
          # The install name is already @rpath from the staging step, and this
          # copy inherits it. Check the executable rather than trusting that:
          # a bad install name never breaks this build, it only surfaces when
          # someone launches the release, which is how it shipped before.
          EXE="$APP_DIR/Contents/MacOS/proxy_ui"
          if [ ! -f "$EXE" ]; then
            echo "::error::$EXE is missing; the Flutter build did not produce an app"
            exit 1
          fi
          LOADS=$(otool -L "$EXE" | grep libhttp_proxy || true)
          if [ -z "$LOADS" ]; then
            echo "::error::proxy_ui has no libhttp_proxy.dylib load command"
            exit 1
          fi
          BAD=$(printf '%s\n' "$LOADS" | grep -v "@rpath/libhttp_proxy.dylib" || true)
          if [ -n "$BAD" ]; then
            echo "::error::proxy_ui does not load libhttp_proxy.dylib through @rpath"
            echo "$BAD"
            exit 1
          fi
          # The Xcode phase already copies the helper, but re-stage it here for
          # the same reason as the dylib: keep this step the single source of
          # truth for what ends up in the shipped bundle. Native code locates it
          # relative to the main executable, so it belongs in Contents/MacOS.
          if [ -f native/macos/http-proxy-tun-helper ]; then
            cp native/macos/http-proxy-tun-helper "$APP_DIR/Contents/MacOS/http-proxy-tun-helper"
            chmod +x "$APP_DIR/Contents/MacOS/http-proxy-tun-helper"
          else
            echo "::error::http-proxy-tun-helper is missing; macOS TUN mode would not work"
            exit 1
          fi
          # Sign the dylib and app
          codesign --force --sign - "$DYLIB_PATH"
          codesign --force --sign - "$APP_DIR/Contents/MacOS/http-proxy-tun-helper"
          codesign --force --deep --sign - "$APP_DIR"

      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          hdiutil create -volname "Proxy UI" -srcfolder proxy_ui.app -ov -format UDZO proxy-ui-macos.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/Build/Products/Release/proxy-ui-macos.dmg

      - name: Generate download summary
        run: |
          echo "## 🍎 macOS DMG Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  build-windows:
    needs: download-native-libs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: native/

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Build Windows app with fastforge
        run: |
          dart pub global activate fastforge
          flutter pub get
          dart pub global run fastforge:main release --name production

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/**
          if-no-files-found: warn

      - name: Generate download summary
        shell: bash
        run: |
          echo "## 🪟 Windows Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  build-linux:
    needs: download-native-libs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: native/

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Build Linux app
        run: |
          flutter pub get
          flutter build linux --release

      - name: Create archive
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf proxy-ui-linux-x64.tar.gz *

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: build/linux/x64/release/bundle/proxy-ui-linux-x64.tar.gz

      - name: Generate download summary
        run: |
          echo "## 🐧 Linux Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.create_release == 'true' && github.event.inputs.release_tag != '' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          # Desktop only, and nothing here builds mobile any more: a runner
          # signs with a debug key it generates per run, so a phone could not
          # install one release over another. Mobile packages are built locally
          # against a stable key and uploaded to this release by hand.
          mkdir -p release
          find artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" -o -name "*.msi" -o -name "*.msix" -o -name "*.appx" -o -name "*.appxbundle" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "Proxy UI ${{ github.event.inputs.release_tag }}"
          draft: false
          body: |
            # Proxy UI Release ${{ github.event.inputs.release_tag }}

            Cross-platform graphical interface for proxy-everything.

            Native library version: ${{ github.event.inputs.lib_version }}

            ## Downloads
            - **macOS**: DMG installer
            - **Windows**: Installer (fastforge) or portable package
            - **Linux**: tar.gz archive
            - **Android / iOS**: uploaded separately, built locally against a
              stable signing key so an installed copy can be updated in place
          files: release/*
