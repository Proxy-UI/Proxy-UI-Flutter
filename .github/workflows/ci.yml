name: Flutter CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      check_android:
        description: 'Also compile Android (CI APKs must never be distributed)'
        type: boolean
        default: false

env:
  PRIVATE_REPO: acking-you/proxy-everything
  LIB_VERSION: '0.6.11'
  FLUTTER_VERSION: '3.47.7'

jobs:
  # App-proxy logic, launchers and routing are tested natively in the core
  # repository; this job checks that the Windows bundle ships what they need.
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ./.github/actions/setup-fvm
      - name: Get dependencies
        run: fvm flutter pub get
      # Fork PRs cannot download private native release inputs.
      - name: Stage verified native libraries
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'app-proxy-native'
          New-Item -ItemType Directory -Force $work, native/windows/x64 | Out-Null
          $name = "libhttp_proxy-$env:LIB_VERSION-x86_64-pc-windows-msvc"
          gh release download $env:LIB_VERSION -R $env:PRIVATE_REPO -p "$name.zip" -p SHA256SUMS -D $work
          if ($LASTEXITCODE -ne 0) { throw 'Native release download failed' }
          $line = @(Get-Content (Join-Path $work 'SHA256SUMS') | Where-Object {
            $_ -match ("^[0-9a-fA-F]{64}\s+\*?" + [regex]::Escape("$name.zip") + '$')
          })
          if ($line.Count -ne 1) { throw 'Native archive checksum is missing or ambiguous' }
          $expected = ($line[0] -split '\s+')[0]
          $archive = Join-Path $work "$name.zip"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Native archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $work
          foreach ($file in @('http_proxy.dll', 'wintun.dll', 'cipherrelay-updater.exe', 'cipherrelay-app-launcher.exe')) {
            Copy-Item -LiteralPath (Join-Path $work "$name/$file") -Destination native/windows/x64/
          }
      - name: Build and verify the Windows desktop bundle
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          fvm flutter build windows --debug
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          $bundle = 'build/windows/x64/runner/Debug'
          foreach ($file in @('CipherRelay.exe', 'http_proxy.dll', 'wintun.dll', 'cipherrelay-updater.exe', 'cipherrelay-app-launcher.exe', 'flutter_windows.dll')) {
            if (-not (Test-Path (Join-Path $bundle $file))) { throw "Missing bundle file: $file" }
          }

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ./.github/actions/setup-fvm
      - name: Get dependencies
        run: fvm flutter pub get
      - name: Analyze code
        run: fvm flutter analyze --no-fatal-infos
      - name: Check formatting
        run: fvm dart format --set-exit-if-changed lib/ test/
      - name: Run tests
        run: fvm flutter test
      - name: Test desktop packaging
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
          python3 -B -m unittest discover -s scripts/macos -p 'test_*.py'

  # Mobile packaging is excluded from this desktop release. Keep a manually
  # selectable compile check; distributable APKs still require the local key.
  android-compile-check:
    if: github.event_name == 'workflow_dispatch' && inputs.check_android
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ./.github/actions/setup-fvm
      - name: Get dependencies
        run: fvm flutter pub get
      - name: Download Android native libraries
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          mkdir -p native/android/{arm64-v8a,armeabi-v7a,x86_64}
          WORK_DIR=$(mktemp -d)
          trap 'rm -rf "$WORK_DIR"' EXIT
          gh release download "$LIB_VERSION" -R "$PRIVATE_REPO" -p SHA256SUMS -D "$WORK_DIR"
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            gh release download "$LIB_VERSION" -R "$PRIVATE_REPO" \
              -p "libhttp_proxy-${LIB_VERSION}-${target}.tar.gz" -D "$WORK_DIR"
            (cd "$WORK_DIR" && sha256sum --ignore-missing -c SHA256SUMS)
            tar -xzf "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}.tar.gz" -C "$WORK_DIR"
            case $target in
              aarch64-linux-android) dest="arm64-v8a" ;;
              armv7-linux-androideabi) dest="armeabi-v7a" ;;
              x86_64-linux-android) dest="x86_64" ;;
            esac
            cp "$WORK_DIR/libhttp_proxy-${LIB_VERSION}-${target}/libhttp_proxy.so" "native/android/$dest/"
          done
      - name: Compile APK only
        run: fvm flutter build apk --release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-check-apk-not-distributable
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
