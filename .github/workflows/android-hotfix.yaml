name: Publish Android APKs to an existing release
run-name: Android APKs for ${{ inputs.release_tag }} · native ${{ inputs.lib_version }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing CipherRelay release (for example v2.0.20)
        required: true
        type: string
      lib_version:
        description: Published native library version to build against
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cipherrelay-release-${{ inputs.release_tag }}

jobs:
  build-android:
    uses: ./.github/workflows/android-package.yaml
    with:
      lib_version: ${{ inputs.lib_version }}
      release_tag: ${{ inputs.release_tag }}
    secrets:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: android-apks
          path: android-apks
      - name: Ensure pinned Android build tools
        run: test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || sdkmanager 'build-tools;36.0.0'
      - name: Verify original release and stage signed Android metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          NATIVE_SOURCE: ${{ needs.build-android.outputs.native_source_commit }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          SOURCE=$(git rev-parse "$RELEASE_TAG^{commit}")
          mkdir release
          gh release download "$RELEASE_TAG" --dir release
          python3 scripts/sign_release_manifest.py release/release-manifest.json --verify scripts/update_signing_key.pub.pem
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          cp android-apks/*.apk release/
          python3 scripts/attach_android_manifest.py release "$ANDROID_HOME/build-tools/36.0.0" "$SOURCE" \
            --android-build "${VERSION#*+}" --android-source-commit "$GITHUB_SHA" \
            --android-native-source-commit "$NATIVE_SOURCE" --build-environment github-actions
      - name: Sign and verify replacement manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_SIGNING_KEY"
          KEY=$(mktemp)
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$KEY"
          python3 scripts/sign_release_manifest.py release/release-manifest.json --key "$KEY"
          python3 scripts/sign_release_manifest.py release/release-manifest.json --verify scripts/update_signing_key.pub.pem
      - name: Publish verified APKs and signed metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" android-apks/*.apk
          gh release upload "$RELEASE_TAG" release/release-manifest.json release/release-manifest.json.sig release/SHA256SUMS --clobber
