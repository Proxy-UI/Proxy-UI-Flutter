output: dist/
releases:
  - name: production
    jobs:
      - name: windows-exe
        package:
          platform: windows
          target: exe
          artifact_name: 'cipherrelay-v{{build_name}}-{{build_number}}-windows-x64-setup.{{ext}}'
      - name: windows-zip
        package:
          platform: windows
          target: zip
          artifact_name: 'cipherrelay-v{{build_name}}-{{build_number}}-windows-x64.{{ext}}'
